<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cue</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%23161514'/%3E%3Cpath d='M36 17c-6.8 0-12 5.8-12 15s5.2 15 12 15c4.1 0 7.4-1.7 9.7-4.8l-4.8-3.5c-1.2 1.6-2.7 2.5-4.9 2.5-3.6 0-6-3.5-6-9.2s2.4-9.2 6-9.2c2.1 0 3.6.8 4.8 2.4l4.9-3.4C43.4 18.7 40.1 17 36 17Z' fill='%23fff'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --ink: #151515;
      --muted: #7d7a76;
      --soft: #f6f4f0;
      --chrome: #ece9e4;
      --line: rgba(25, 25, 25, 0.13);
      --line-soft: rgba(25, 25, 25, 0.08);
      --field: #ffffff;
      --blue: #0a84ff;
      --green: #34c759;
      --yellow: #ffd60a;
      --red: #ff453a;
      --shadow: 0 48px 140px rgba(24, 20, 14, 0.25);
      --sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
      --serif: "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --mono: ui-monospace, "SF Mono", Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      overflow: hidden;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.72), transparent 38%),
        radial-gradient(circle at 16% 9%, rgba(255, 214, 10, 0.18), transparent 26%),
        radial-gradient(circle at 92% 86%, rgba(10, 132, 255, 0.12), transparent 34%),
        linear-gradient(160deg, #f7f4ee, #ebe5da 56%, #f7f7f5);
      color: var(--ink);
      font-family: var(--sans);
    }

    body::before {
      position: fixed;
      inset: 0;
      pointer-events: none;
      content: "";
      background-image: linear-gradient(rgba(18, 18, 18, 0.025) 1px, transparent 1px);
      background-size: 100% 20px;
      mask-image: linear-gradient(90deg, black, transparent 76%);
    }

    .stage {
      position: relative;
      min-height: 100vh;
      isolation: isolate;
    }

    .compose {
      position: absolute;
      top: 9vh;
      left: 6vw;
      width: max(1120px, 108vw);
      height: max(820px, 92vh);
      overflow: hidden;
      background: var(--field);
      border: 1px solid rgba(255, 255, 255, 0.9);
      border-radius: 20px;
      box-shadow: var(--shadow), inset 0 1px 0 rgba(255, 255, 255, 0.96);
      transform: rotate(-1.6deg);
      transform-origin: 26% 18%;
    }

    .compose::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      content: "";
      background:
        linear-gradient(90deg, rgba(255, 255, 255, 0.5), transparent 19%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.24), transparent 42%);
      mix-blend-mode: soft-light;
    }

    .toolbar {
      position: relative;
      z-index: 2;
      display: grid;
      grid-template-columns: 112px 1fr 212px;
      align-items: center;
      height: 64px;
      padding: 0 22px;
      background:
        linear-gradient(180deg, rgba(248, 247, 244, 0.98), rgba(232, 229, 224, 0.96));
      border-bottom: 1px solid var(--line);
    }

    .traffic {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 13px;
      height: 13px;
      border-radius: 50%;
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.1);
    }

    .dot.red { background: var(--red); }
    .dot.yellow { background: var(--yellow); }
    .dot.green { background: var(--green); }

    .toolbar-title {
      justify-self: center;
      color: rgba(21, 21, 21, 0.58);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0;
    }

    .tools {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }

    .tool {
      display: grid;
      width: 32px;
      height: 28px;
      place-items: center;
      color: rgba(21, 21, 21, 0.54);
      border: 1px solid rgba(255, 255, 255, 0.62);
      border-radius: 7px;
      background: rgba(255, 255, 255, 0.38);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.74), 0 1px 1px rgba(0, 0, 0, 0.04);
    }

    .send {
      color: #fff;
      background: linear-gradient(180deg, #3a9bff, #0a84ff);
      border-color: rgba(10, 132, 255, 0.26);
    }

    .tool svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .fields {
      position: relative;
      z-index: 1;
      padding: 11px 48px 0;
      background: linear-gradient(180deg, #fff, #fff 82%, rgba(250, 250, 249, 0.96));
      border-bottom: 1px solid var(--line-soft);
    }

    .row {
      display: grid;
      grid-template-columns: 76px 1fr;
      align-items: center;
      min-height: 38px;
      border-bottom: 1px solid var(--line-soft);
    }

    .row:last-child {
      border-bottom: 0;
    }

    .label {
      color: rgba(21, 21, 21, 0.48);
      font-size: 15px;
      letter-spacing: 0;
    }

    .value {
      color: rgba(21, 21, 21, 0.72);
      font-size: 16px;
      letter-spacing: 0;
    }

    .value.subject {
      color: var(--ink);
      font-weight: 520;
    }

    .body {
      position: relative;
      z-index: 1;
      padding: 42px 58px 72px;
    }

    .dictation {
      max-width: min(760px, 70vw);
      min-height: 430px;
      color: var(--ink);
      font-family: var(--serif);
      font-size: clamp(34px, 3.65vw, 54px);
      line-height: 1.06;
      letter-spacing: 0;
    }

    .sentence {
      position: relative;
      display: inline;
      white-space: normal;
    }

    .sentence.is-lead {
      display: block;
      margin-bottom: 0.72em;
    }

    .sentence.is-paragraph {
      display: block;
      margin-top: 0.72em;
    }

    .word {
      display: inline;
      opacity: 0;
      filter: blur(7px);
      transform: translateY(0.18em);
      animation: land 330ms cubic-bezier(0.2, 0.74, 0.12, 1) forwards;
    }

    .clean-word {
      animation: settle 380ms cubic-bezier(0.18, 0.72, 0.16, 1) forwards;
    }

    .token-disfluency,
    .token-false-start,
    .token-substitution {
      color: rgba(21, 21, 21, 0.42);
      font-style: italic;
    }

    .token-code {
      font-family: var(--mono);
      font-size: 0.58em;
      letter-spacing: 0;
      white-space: nowrap;
    }

    .token-name {
      font-style: italic;
    }

    .cursor {
      position: relative;
      display: inline-block;
      width: 0.07em;
      height: 0.82em;
      margin-left: 0.055em;
      background: var(--blue);
      border-radius: 99px;
      vertical-align: -0.08em;
      box-shadow: 0 0 18px rgba(10, 132, 255, 0.3);
      animation: cursor-breathe 960ms ease-in-out infinite;
    }

    .cursor::before,
    .cursor::after {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 0.92em;
      height: 0.92em;
      pointer-events: none;
      content: "";
      border: 1px solid rgba(10, 132, 255, 0.14);
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0.34);
      animation: listen-ring 1680ms ease-out infinite;
    }

    .cursor::after {
      animation-delay: 560ms;
    }

    .quiet-rule {
      width: 46vw;
      height: 1px;
      margin-top: 42px;
      background: linear-gradient(90deg, rgba(21, 21, 21, 0.15), transparent);
      transform-origin: left;
      animation: breathe 3.8s ease-in-out infinite;
    }

    @keyframes land {
      to {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @keyframes settle {
      0% {
        opacity: 0;
        filter: blur(5px);
        transform: translateY(0.1em);
      }
      100% {
        opacity: 1;
        filter: blur(0);
        transform: translateY(0);
      }
    }

    @keyframes cursor-breathe {
      0%,
      100% {
        opacity: 0.48;
        transform: scaleY(0.86);
        box-shadow: 0 0 8px rgba(10, 132, 255, 0.14);
      }
      50% {
        opacity: 1;
        transform: scaleY(1);
        box-shadow: 0 0 26px rgba(10, 132, 255, 0.42);
      }
    }

    @keyframes listen-ring {
      0% {
        opacity: 0.34;
        transform: translate(-50%, -50%) scale(0.3);
      }
      82%,
      100% {
        opacity: 0;
        transform: translate(-50%, -50%) scale(1.1);
      }
    }

    @keyframes breathe {
      0%,
      100% { transform: scaleX(0.74); opacity: 0.36; }
      50% { transform: scaleX(1); opacity: 0.72; }
    }

    @media (max-width: 900px) {
      .compose {
        left: 22px;
        width: 1120px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        animation-duration: 1ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 1ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="stage" aria-label="Cue dictation proof of concept">
    <section class="compose" aria-label="Apple Mail compose window">
      <div class="toolbar" aria-hidden="true">
        <div class="traffic">
          <span class="dot red"></span>
          <span class="dot yellow"></span>
          <span class="dot green"></span>
        </div>
        <div class="toolbar-title">New Message</div>
        <div class="tools">
          <span class="tool send">
            <svg viewBox="0 0 24 24"><path d="M5 12h13"></path><path d="m13 6 6 6-6 6"></path></svg>
          </span>
          <span class="tool">
            <svg viewBox="0 0 24 24"><path d="m21.4 11.6-8.8 8.8a5 5 0 0 1-7.1-7.1l9.2-9.2a3.5 3.5 0 0 1 5 5l-9.2 9.2a2 2 0 0 1-2.8-2.8l8.4-8.4"></path></svg>
          </span>
          <span class="tool">
            <svg viewBox="0 0 24 24"><path d="M4 7h16"></path><path d="M7 12h10"></path><path d="M9 17h6"></path></svg>
          </span>
          <span class="tool">
            <svg viewBox="0 0 24 24"><path d="M4 19 11 5h2l7 14"></path><path d="M7 14h10"></path></svg>
          </span>
        </div>
      </div>

      <div class="fields" aria-hidden="true">
        <div class="row">
          <span class="label">To:</span>
          <span class="value">someone who still types everything</span>
        </div>
        <div class="row">
          <span class="label">From:</span>
          <span class="value">Cue</span>
        </div>
        <div class="row">
          <span class="label">Subject:</span>
          <span class="value subject">I wrote this out loud</span>
        </div>
      </div>

      <div class="body">
        <div class="dictation" id="dictation" aria-live="polite"></div>
        <div class="quiet-rule" aria-hidden="true"></div>
      </div>
    </section>
  </main>

  <script>
    const lines = [
      {
        rough: [
          { text: "Cue", kind: "name" },
          { text: "writes", kind: "plain" },
          { text: "with", kind: "plain" },
          { text: "your", kind: "plain" },
          { text: "voice,", kind: "plain", pause: 180 },
          { text: "like,", kind: "disfluency", pause: 90 },
          { text: "uh,", kind: "disfluency", pause: 130 },
          { text: "you", kind: "disfluency" },
          { text: "know,", kind: "disfluency", pause: 140 },
          { text: "word", kind: "plain" },
          { text: "by", kind: "plain" },
          { text: "word.", kind: "plain", pause: 520 }
        ],
        clean: [
          { text: "Cue", kind: "name" },
          { text: "writes", kind: "plain" },
          { text: "with", kind: "plain" },
          { text: "your", kind: "plain" },
          { text: "voice,", kind: "plain" },
          { text: "word", kind: "plain" },
          { text: "by", kind: "plain" },
          { text: "word.", kind: "plain" }
        ],
        cleanupDelay: 620,
        nextDelay: 0
      },
      {
        rough: [
          { text: "It", kind: "plain" },
          { text: "can", kind: "plain" },
          { text: "remember", kind: "plain" },
          { text: "unusual", kind: "plain" },
          { text: "names,", kind: "plain", pause: 190 },
          { text: "uh,", kind: "disfluency", pause: 120 },
          { text: "recognize", kind: "plain" },
          { text: "code", kind: "plain" },
          { text: "syntax,", kind: "plain", pause: 220 },
          { text: "and", kind: "plain" },
          { text: "fix", kind: "plain" },
          { text: "ceramnic", kind: "substitution" },
          { text: "meaning.", kind: "plain", pause: 540 }
        ],
        clean: [
          { text: "It", kind: "plain" },
          { text: "can", kind: "plain" },
          { text: "remember", kind: "plain" },
          { text: "unusual", kind: "plain" },
          { text: "names,", kind: "plain" },
          { text: "recognize", kind: "plain" },
          { text: "code", kind: "plain" },
          { text: "syntax,", kind: "plain" },
          { text: "and", kind: "plain" },
          { text: "fix", kind: "plain" },
          { text: "semantic", kind: "plain" },
          { text: "meaning.", kind: "plain" }
        ],
        cleanupDelay: 700,
        nextDelay: 0
      },
      {
        rough: [
          { text: "It", kind: "plain" },
          { text: "removes", kind: "plain" },
          { text: "the", kind: "plain" },
          { text: "stumbles", kind: "plain" },
          { text: "and", kind: "plain" },
          { text: "only", kind: "plain" },
          { text: "keeps", kind: "plain" },
          { text: "what", kind: "plain" },
          { text: "you", kind: "plain" },
          { text: "said,", kind: "substitution", pause: 170 },
          { text: "no,", kind: "false-start", pause: 160 },
          { text: "what", kind: "plain" },
          { text: "you", kind: "plain" },
          { text: "meant.", kind: "plain", pause: 980 }
        ],
        clean: [
          { text: "It", kind: "plain" },
          { text: "removes", kind: "plain" },
          { text: "the", kind: "plain" },
          { text: "stumbles", kind: "plain" },
          { text: "and", kind: "plain" },
          { text: "only", kind: "plain" },
          { text: "keeps", kind: "plain" },
          { text: "what", kind: "plain" },
          { text: "you", kind: "plain" },
          { text: "meant.", kind: "plain" }
        ],
        cleanupDelay: 720,
        nextDelay: 0
      },
      {
        paragraph: true,
        rough: [
          { text: "Best", kind: "plain" },
          { text: "of", kind: "plain" },
          { text: "all,", kind: "plain", pause: 160 },
          { text: "it's", kind: "plain" },
          { text: "totally", kind: "plain" },
          { text: "free", kind: "plain" },
          { text: "and", kind: "plain" },
          { text: "runs", kind: "plain" },
          { text: "locally", kind: "plain" },
          { text: "on", kind: "plain" },
          { text: "your", kind: "plain" },
          { text: "Mac.", kind: "plain", pause: 980 }
        ],
        clean: [
          { text: "Best", kind: "plain" },
          { text: "of", kind: "plain" },
          { text: "all,", kind: "plain" },
          { text: "it's", kind: "plain" },
          { text: "totally", kind: "plain" },
          { text: "free", kind: "plain" },
          { text: "and", kind: "plain" },
          { text: "runs", kind: "plain" },
          { text: "locally", kind: "plain" },
          { text: "on", kind: "plain" },
          { text: "your", kind: "plain" },
          { text: "Mac.", kind: "plain" }
        ],
        cleanupDelay: 720,
        nextDelay: 0
      }
    ];

    const stage = document.querySelector(".stage");
    const dictation = document.getElementById("dictation");
    const cursor = document.createElement("span");
    cursor.className = "cursor";
    cursor.setAttribute("aria-hidden", "true");

    let lineIndex = 0;
    let tokenIndex = 0;
    let activeSentence = null;
    let cleanupTimers = [];

    function complexityDelay(token) {
      const raw = token.text.replace(/[`.,;()]/g, "");
      const base = 86;
      const length = Math.min(raw.length, 12) * 17;
      const code = token.kind === "code" ? 116 : 0;
      const name = token.kind === "name" ? 72 : 0;
      const stumble = token.kind === "disfluency" || token.kind === "false-start" ? 42 : 0;
      const punctuation = /[.;(),]/.test(token.text) ? 86 : 0;
      const breath = token.pause || 0;
      return base + length + code + name + stumble + punctuation + breath;
    }

    function renderCursor(target = activeSentence || dictation) {
      cursor.remove();
      target.appendChild(cursor);
    }

    function addWord(token) {
      const word = document.createElement("span");
      word.className = `word token-${token.kind}`;
      word.textContent = token.text + " ";
      activeSentence.insertBefore(word, cursor);
    }

    function resetLine() {
      cleanupTimers.forEach((timer) => window.clearTimeout(timer));
      cleanupTimers = [];
      dictation.textContent = "";
      dictation.appendChild(cursor);
    }

    function addCleanWord(token, target) {
      const word = document.createElement("span");
      word.className = `word clean-word token-${token.kind}`;
      word.textContent = token.text + " ";
      target.appendChild(word);
    }

    function polishLine(line, sentence, shouldOwnCursor) {
      const timer = window.setTimeout(() => {
        const cursorWasHere = cursor.parentElement === sentence;

        if (cursorWasHere) {
          cursor.remove();
        }

        sentence.textContent = "";
        line.clean.forEach((token) => addCleanWord(token, sentence));
        sentence.className = [
          "sentence",
          "is-clean",
          sentence.dataset.lead === "true" ? "is-lead" : "",
          sentence.dataset.paragraph === "true" ? "is-paragraph" : ""
        ].filter(Boolean).join(" ");

        if (shouldOwnCursor || cursorWasHere) {
          renderCursor(sentence);
        }

        if (shouldOwnCursor) {
          stage.classList.add("is-complete");
        }
      }, 520);

      cleanupTimers.push(timer);
    }

    function schedulePolish(line, sentence, shouldOwnCursor) {
      const timer = window.setTimeout(() => {
        polishLine(line, sentence, shouldOwnCursor);
      }, line.cleanupDelay);

      cleanupTimers.push(timer);
    }

    function startLine() {
      activeSentence = document.createElement("span");
      activeSentence.className = "sentence";
      if (lineIndex === 0) {
        activeSentence.classList.add("is-lead");
        activeSentence.dataset.lead = "true";
      }
      if (lines[lineIndex].paragraph) {
        activeSentence.classList.add("is-paragraph");
        activeSentence.dataset.paragraph = "true";
      }
      cursor.remove();
      dictation.appendChild(activeSentence);
      renderCursor(activeSentence);
      tick();
    }

    function tick() {
      const line = lines[lineIndex];

      if (tokenIndex >= line.rough.length) {
        const completedSentence = activeSentence;
        const isFinalLine = lineIndex >= lines.length - 1;
        schedulePolish(line, completedSentence, isFinalLine);

        if (isFinalLine) {
          return;
        }

        lineIndex += 1;
        tokenIndex = 0;
        window.setTimeout(startLine, line.nextDelay);
        return;
      }

      const token = line.rough[tokenIndex];
      addWord(token);
      renderCursor(activeSentence);
      tokenIndex += 1;
      window.setTimeout(tick, complexityDelay(token));
    }

    function startDictation() {
      stage.classList.remove("is-complete");
      lineIndex = 0;
      tokenIndex = 0;
      activeSentence = null;
      resetLine();
      startLine();
    }

    resetLine();
    window.setTimeout(startDictation, 2200);
  </script>
</body>
</html>
